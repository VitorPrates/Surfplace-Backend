<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="./funks.js" defer></script>
</head>
<body>
    <h1>Formulário de Login</h1>
    <h3 id="hello_user">Faça seu login!</h3>
     <nav class="navegando">
        <button class="view bntview" >Login</button>
        <button class="bntview" id="criar_post">Criar Post</button>
        <button class="bntview" id="ver_posts">Ver posts</button>
    </nav>
    <main class="main">
        <div class="display display_login">
            <form action="/cadastro" method="POST" id="form_cadastro">
            <h2>Cadastro</h2>
            <label for="nome">Nome</label>
            <input name="nome" required>
            <label for="sobrenome">Sobrenome</label>
            <input name="sobrenome" required>
            <label for="email">Email</label>
            <input name="email" type="email" required>
            <label for="senha">Senha</label>
            <input name="senha" type="password" minlength="8" required>
            <!-- Inclua sobrenome e senha. -->
            <button type="submit">Cadastrar</button>
            </form>

            <form id="form_login">
                <h2>Login</h2>
                <label for="email">Email</label>
                <input name="email" type="email" required>
                <label for="senha">Senha</label>
                <input name="senha" type="password" required>
                <button type="submit">Conferir acesso</button>
            </form>
        </div>
        <div class=" display display_create">
            <p id="criar_post_msg">criar post</p>
            <form action="/criar_post" method="post" class="form_post" id="form_post">
                <label for="postar">Postar:</label>
                <textarea maxlength="200" name="post" id="post_text" placeholder="seu post aqui">

                </textarea>
                <button>Enviar</button>
            </form>
        </div>
        <div class=" display display_verpost">
            <ul id="posts_criados">
                <li>
                    <p>lorem</p>
                    <span>👍 0</span>
                    <span>👎 0</span>
                </li>
                <li>
                    <p>Lorem </p>
                    <span>👍 0</span>
                    <span>👎 0</span>
                    <span>21/10/2026, 19:37:17</span>
                </li>
            </ul>
        </div>
    </main>

</body>
</html>
